<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSVP — Chukwuma &amp; Ellen</title>
<meta name="description" content="RSVP for Chukwuma and Ellen's wedding on 18 December 2026.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="page-header">
  <a href="index.html" class="page-header__back">← Back to Chukwuma &amp; Ellen's Wedding</a>
</header>

<main>
  <section class="rsvp-page">
    <div class="rsvp-page__media">
      <div class="rsvp-page__media-inner">
        <img src="assets/images/engagement-garden.jpg" alt="Chukwuma and Ellen together in a garden setting" loading="lazy">
      </div>
    </div>

    <div class="rsvp-page__content">
      <div class="rsvp-page__inner">
        <p class="eyebrow eyebrow--center reveal">Kindly Respond By 15 November 2026</p>
        <h1 class="section-title section-title--center reveal">RSVP</h1>
        <p class="rsvp__intro reveal">We can't wait to celebrate with you. Please let us know if you'll be joining us.</p>

        <div class="rsvp-card reveal">
          <form class="rsvp-form" id="rsvp-form" action="https://formsubmit.co/chukwumaajaegbu@gmail.com" method="POST">
            <input type="hidden" name="_subject" value="New RSVP — Chukwuma &amp; Ellen's Wedding">
            <input type="hidden" name="_template" value="table">
            <input type="hidden" name="_captcha" value="false">
            <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">

            <div class="rsvp-form__field rsvp-form__field--full">
              <label for="guest-name">Full Name</label>
              <input type="text" id="guest-name" name="guest-name" placeholder="As it appears on your invitation" required>
            </div>

            <fieldset class="rsvp-form__field rsvp-form__field--full">
              <legend>Will you attend?</legend>
              <div class="rsvp-form__toggle">
                <label class="toggle-option"><input type="radio" name="attending" value="yes" required><span>Joyfully Accepts</span></label>
                <label class="toggle-option"><input type="radio" name="attending" value="no" required><span>Regretfully Declines</span></label>
              </div>
            </fieldset>

            <div class="rsvp-form__field">
              <label for="dietary">Dietary Requirements</label>
              <input type="text" id="dietary" name="dietary" placeholder="e.g. Vegetarian, Halal, none">
            </div>

            <div class="rsvp-form__field">
              <label for="allergies">Allergies</label>
              <input type="text" id="allergies" name="allergies" placeholder="e.g. Nuts, Shellfish, none">
            </div>

            <div class="rsvp-form__field rsvp-form__field--full rsvp-form__submit-row">
              <button type="submit" class="btn btn--solid">Send RSVP</button>
            </div>
          </form>

          <div class="rsvp-success" id="rsvp-success" hidden>
            <p>Thank you! Your RSVP has been received — we can't wait to celebrate with you.</p>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <p class="footer__names">Chukwuma <span class="amp">&amp;</span> Ellen</p>
  <p class="footer__sub">18 · 12 · 2026</p>
</footer>

<script src="js/script.js"></script>
</body>
</html>
